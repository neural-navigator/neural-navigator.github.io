<footer style="background: rgba(7, 9, 19, 0.95); border-top: 1px solid var(--border-subtle); padding: 3rem 0 2rem 0; margin-top: auto;">

    <div class="container" style="display: flex; flex-direction: column; gap: 2rem;">

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">

            <a href="/" class="brand-logo">
                <div class="logo-icon">
                    <i class="fa-solid fa-network-wired"></i>
                </div>
                <span>Neural<span style="color: var(--accent-cyan);">Navigator</span> Lab</span>
            </a>

            <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; font-size: 0.9rem; font-family: var(--font-heading);">
                <a href="/" style="color: var(--text-secondary);">Research</a>
                <a href="#projects" style="color: var(--text-secondary);">Projects</a>
                <a href="#experiments" style="color: var(--text-secondary);">Experiments</a>
                <a href="https://github.com/{{ site.github_username }}" target="_blank" style="color: var(--text-secondary);">GitHub</a>
                <a href="/archive.html" style="color: var(--text-secondary);">Archive</a>
            </div>

            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'});" style="background: rgba(30, 41, 59, 0.6); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 0.5rem 1rem; border-radius: 8px; font-family: var(--font-heading); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem;">
                <i class="fa-solid fa-arrow-up"></i> Top
            </button>

        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.82rem; color: var(--text-muted);">

            <p>© 2026 {{ site.author }} (Neural Navigator). Built with Jekyll & Custom Electric Glassmorphism Theme.</p>

            <div style="display: flex; gap: 1rem;">
                <a href="#" style="color: var(--text-muted);">Privacy Policy</a>
                <a href="#" style="color: var(--text-muted);">RSS Feed</a>
            </div>

        </div>

    </div>

</footer>
